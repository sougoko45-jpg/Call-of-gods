<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call of Gods — Skill Tree</title>
<style>
:root{--bg:#08070c;--panel:#11101a;--panel2:#171421;--gold:#d2ad68;--gold2:#f1d99f;--purple:#8d4ed0;--purple2:#bd79ff;--text:#f5f0ff;--muted:#aaa1b8;--line:#3b3048;--ok:#72d0a0;--bad:#d56a74}
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 background:radial-gradient(circle at 50% 0,#29163a 0,#0b0910 43%,#05050a 100%);
 color:var(--text);
 font-family:Inter,system-ui,Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
 min-height:100vh;
 display:grid;
 grid-template-columns:260px 1fr
}

aside{
 padding:20px;
 background:#09080ee8;
 border-right:1px solid #30263a;
 position:sticky;
 top:0;
 height:100vh
}

.brand{text-align:center;margin-bottom:18px}
.sig{font-size:10px;letter-spacing:3px;color:var(--gold)}
.brand h1{
 font:700 23px Georgia,serif;
 letter-spacing:3px;
 margin:7px 0
}
.brand p{font-size:10px;color:var(--muted)}

.classes{display:grid;gap:7px}

.classBtn,.btn{
 border:1px solid #382b43;
 background:#12101a;
 color:var(--text);
 border-radius:10px;
 padding:11px 12px
}

.classBtn{text-align:left}
.classBtn.active{
 border-color:var(--gold);
 background:#21172a
}
.classBtn b{display:block}
.classBtn small{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-top:3px
}

.box{
 margin-top:14px;
 padding:13px;
 border:1px solid #30263a;
 border-radius:12px;
 background:#0e0c14
}

.box label{
 font-size:10px;
 color:var(--muted);
 display:block;
 margin-bottom:6px;
 letter-spacing:1px
}

.box input{
 width:100%;
 background:#08070c;
 border:1px solid #3b3045;
 color:#fff;
 border-radius:8px;
 padding:9px
}

.sideBtns{display:grid;gap:7px}

.btn.primary{
 background:#7140a8;
 border-color:#a96de2
}

.btn.danger{
 color:#f2abb1;
 border-color:#66353c
}

.btn.full{width:100%}

main{
 padding:24px;
 min-width:0
}

.head{
 display:flex;
 justify-content:space-between;
 gap:15px;
 align-items:flex-start
}

.eyebrow{
 font-size:10px;
 letter-spacing:3px;
 color:var(--gold)
}

h2.title{
 font:700 35px Georgia,serif;
 margin:5px 0
}

.desc{
 margin:0;
 color:var(--muted);
 max-width:780px
}

.headBtns{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
 margin:18px 0 12px
}

.stat{
 background:#100e16;
 border:1px solid #30263a;
 border-radius:11px;
 padding:12px
}

.stat span{
 font-size:9px;
 color:var(--muted);
 letter-spacing:1px
}

.stat strong{
 display:block;
 color:var(--gold2);
 font-size:22px;
 margin-top:3px
}

.tools{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-bottom:12px
}

.tools input,.tools select{
 background:#0d0b12;
 color:#eee;
 border:1px solid #342b3e;
 border-radius:9px;
 padding:9px
}

.tools input{min-width:220px}

.treeWrap{
 overflow:auto;
 border:1px solid #32283d;
 border-radius:15px;
 background:linear-gradient(#100d16,#0a080e);
 min-height:620px
}

.tree{
 min-width:1080px;
 padding:24px 26px 60px
}

.branch{margin:8px 0 30px}

.branchTitle{
 display:flex;
 gap:10px;
 align-items:center;
 color:var(--gold2);
 font:600 18px Georgia,serif
}

.branchTitle:after{
 content:"";
 height:1px;
 background:var(--line);
 flex:1
}

.nodes{
 display:flex;
 flex-wrap:wrap;
 gap:13px;
 margin-top:14px
}

.node{
 width:180px;
 min-height:152px;
 background:#15121d;
 border:1px solid #43334e;
 border-radius:13px;
 padding:12px;
 position:relative;
 transition:.18s;
 user-select:none
}

.node:hover{
 transform:translateY(-2px);
 border-color:#755694
}

.node.locked{opacity:.55}
.node.available{border-color:var(--purple2)}

.node.unlocked{
 border-color:var(--gold);
 box-shadow:0 0 0 1px #d2ad6820
}

.rarity{
 font-size:8px;
 letter-spacing:1.5px;
 color:var(--gold);
 text-transform:uppercase
}

.node h3{
 font-size:14px;
 margin:8px 0 5px
}

.node p{
 font-size:10px;
 color:var(--muted);
 line-height:1.35;
 min-height:40px;
 margin:0 0 7px
}

.meta{
 font-size:9px;
 color:#cfc5d8;
 margin-top:3px
}

.levelPill{
 position:absolute;
 right:8px;
 top:8px;
 font-size:8px;
 background:#251d2d;
 border:1px solid #4c3b56;
 border-radius:99px;
 padding:3px 5px
}

.progress{
 height:4px;
 background:#251d2d;
 border-radius:99px;
 overflow:hidden;
 margin-top:7px
}

.progress i{
 display:block;
 height:100%;
 background:linear-gradient(90deg,var(--purple),var(--gold));
 width:0
}

.buy{
 width:100%;
 margin-top:8px;
 padding:6px;
 border-radius:7px;
 border:1px solid #5e3b73;
 background:#25172e;
 color:#fff;
 font-size:10px
}

.buy:disabled{
 opacity:.3;
 cursor:not-allowed
}

.toast{
 display:none;
 position:fixed;
 bottom:18px;
 left:50%;
 transform:translateX(-50%);
 background:#18131f;
 border:1px solid #574164;
 border-radius:10px;
 padding:10px 15px;
 z-index:50
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#000b;
 z-index:40;
 align-items:center;
 justify-content:center;
 padding:16px
}

.modal.open{display:flex}

.card{
 width:min(520px,100%);
 background:#11101a;
 border:1px solid #4b3a58;
 border-radius:15px;
 padding:19px;
 box-shadow:0 20px 70px #000
}

.close{
 float:right;
 background:none;
 border:0;
 color:#aaa;
 font-size:23px
}

.details{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px
}

.details div{
 background:#0c0a10;
 border:1px solid #29212f;
 border-radius:8px;
 padding:9px;
 font-size:11px
}

.details b{
 display:block;
 color:var(--muted);
 font-size:8px;
 text-transform:uppercase;
 margin-bottom:3px
}

.code{
 width:100%;
 min-height:130px;
 background:#08070c;
 color:#ddd;
 border:1px solid #3a3044;
 border-radius:9px;
 padding:10px;
 resize:vertical;
 margin:10px 0
}

@media(max-width:850px){
 .app{display:block}

 aside{
  position:relative;
  height:auto;
  border-right:0;
  border-bottom:1px solid #30263a;
  padding:14px
 }

 .brand{margin-bottom:10px}

 .classes{
  grid-template-columns:repeat(3,1fr)
 }

 .classBtn small{display:none}

 main{padding:14px}

 .head{display:block}

 .headBtns{margin-top:10px}

 .stats{
  grid-template-columns:repeat(2,1fr)
 }

 .treeWrap{min-height:540px}

 .tree{
  min-width:930px;
  padding:18px
 }

 .node{width:168px}
}

@media(max-width:500px){
 .classes{grid-template-columns:1fr}

 .tools input{
  min-width:0;
  width:100%
 }

 .details{
  grid-template-columns:1fr
 }

 .title{
  font-size:29px!important
 }
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="brand">
<div class="sig">╬ CALL OF GODS ╬</div>
<h1>SKILL TREE</h1>
<p>Greek Ancient × Dark Fantasy</p>
</div>

<div class="classes" id="classes"></div>

<div class="box">
<label>NÍVEL DO PERSONAGEM</label>
<input id="level" type="number" min="1" max="20" value="1">

<div style="font-size:9px;color:var(--muted);margin-top:7px">
+3 pontos por nível após o nível 1.
</div>
</div>

<div class="box">
<label>BUILD</label>

<div class="sideBtns">

<button class="btn primary full" id="save">
💾 Salvar / Exportar
</button>

<button class="btn full" id="import">
📥 Importar build
</button>

<button class="btn danger full" id="reset">
↺ Resetar árvore
</button>

</div>
</div>

</aside>

<main>

<div class="head">

<div>

<div class="eyebrow" id="eyebrow"></div>

<h2 class="title" id="title"></h2>

<p class="desc" id="desc"></p>

</div>

<div class="headBtns">

<button class="btn" id="undo">
↩ Desfazer
</button>

<button class="btn" id="help">
?
</button>

</div>

</div>

<div class="stats">

<div class="stat">
<span>Nível</span>
<strong id="lv">1</strong>
</div>

<div class="stat">
<span>Pontos totais</span>
<strong id="tp">0</strong>
</div>

<div class="stat">
<span>Usados</span>
<strong id="up">0</strong>
</div>

<div class="stat">
<span>Disponíveis</span>
<strong id="ap">0</strong>
</div>

</div>

<div class="tools">

<input
id="search"
placeholder="🔎 Pesquisar habilidade..."
>

<select id="filter">

<option value="all">
Todas
</option>

<option value="available">
Desbloqueáveis
</option>

<option value="unlocked">
Desbloqueadas
</option>

<option value="locked">
Bloqueadas
</option>

</select>

</div>

<div class="treeWrap">

<div class="tree" id="tree"></div>

</div>

</main>

</div>

<div class="toast" id="toast"></div>

<div class="modal" id="skillModal">

<div class="card">

<button class="close" id="closeSkill">
×
</button>

<div class="eyebrow" id="mr"></div>

<h2
id="mn"
style="font-family:Georgia,serif;margin:5px 0"
></h2>

<p id="md" class="desc"></p>

<div class="details">

<div>
<b>Nível necessário</b>
<span id="ml"></span>
</div>

<div>
<b>Custo</b>
<span id="mc"></span>
</div>

<div>
<b>Requisito</b>
<span id="mreq"></span>
</div>

<div>
<b>Status</b>
<span id="ms"></span>
</div>

</div>

<button
class="btn primary full"
style="margin-top:10px"
id="mbuy"
></button>

</div>

</div>

<div class="modal" id="codeModal">

<div class="card">

<button class="close" id="closeCode">
×
</button>

<div class="eyebrow">
CALL OF GODS
</div>

<h2 style="font-family:Georgia,serif">
Build salva
</h2>

<p class="desc">
Copie este código para guardar ou enviar sua árvore.
</p>

<textarea
id="code"
class="code"
readonly
></textarea>

<button
class="btn primary full"
id="copy"
>
Copiar código
</button>

</div>

</div>

const KEY="cogSkillTree_v2";

let state=
JSON.parse(localStorage.getItem(KEY)||"null")
||
{
 cls:"Vanguarda",
 level:1,
 spent:{},
 history:[]
};

let selected=null;

const total=()=>
Math.max(0,(state.level-1)*3);

const used=()=>
Object.values(state.spent)
.reduce((a,b)=>a+b,0);

const sid=n=>
state.cls+"::"+n;

function obj(a){
 return{
  name:a[0],
  level:a[1],
  cost:a[2],
  req:a[3],
  desc:a[4],
  rarity:a[5],
  max:a[6]||1
 };
}

function find(n){

 for(
  const [branch,list]
  of Object.entries(DATA[state.cls].branches)
 ){

  for(const a of list){

   if(a[0]===n)
    return obj(a);

  }

 }

}

function isUnlocked(s){
 return (state.spent[sid(s.name)]||0)>0;
}

function canBuy(s){

 return(
  state.level>=s.level
  &&
  (!s.req||isUnlocked({name:s.req}))
  &&
  used()+s.cost<=total()
  &&
  (state.spent[sid(s.name)]||0)<s.max
 );

}

function saveState(){
 localStorage.setItem(KEY,JSON.stringify(state));
}

function notify(t){

 const e=document.getElementById("toast");

 e.textContent=t;
 e.style.display="block";

 clearTimeout(window.tt);

 window.tt=setTimeout(
  ()=>e.style.display="none",
  1800
 );

}

function render(){

 const d=DATA[state.cls];

 document.getElementById("classes").innerHTML="";

 for(
  const [name,x]
  of Object.entries(DATA)
 ){

  const b=document.createElement("button");

  b.className=
  "classBtn"+
  (name===state.cls?" active":"");

  b.innerHTML=
  "<b>"+
  x.icon+
  " "+
  name+
  "</b>"+
  "<small>"+
  x.desc+
  "</small>";

  b.onclick=()=>{

   state.cls=name;
   state.spent={};
   state.history=[];

   saveState();
   render();

   notify("Classe alterada.");

  };

  document
  .getElementById("classes")
  .appendChild(b);

 }

 document.getElementById("level").value=
 state.level;

 document.getElementById("eyebrow").textContent=
 state.cls.toUpperCase();

 document.getElementById("title").textContent=
 d.icon+" "+state.cls;

 document.getElementById("desc").textContent=
 d.desc;

 document.getElementById("lv").textContent=
 state.level;

 document.getElementById("tp").textContent=
 total();

 document.getElementById("up").textContent=
 used();

 document.getElementById("ap").textContent=
 total()-used();

 renderTree();

}

function renderTree(){

 const root=document.getElementById("tree");

 root.innerHTML="";

 const q=
 document.getElementById("search")
 .value
 .toLowerCase();

 const f=
 document.getElementById("filter")
 .value;

 for(
  const [branch,list]
  of Object.entries(DATA[state.cls].branches)
 ){

  const sec=document.createElement("section");

  sec.className="branch";

  sec.innerHTML=
  '<div class="branchTitle">'+
  branch+
  '</div>'+
  '<div class="nodes"></div>';

  const box=
  sec.querySelector(".nodes");

  for(const a of list){

   const s=obj(a);

   const spent=
   state.spent[sid(s.name)]||0;

   const ok=
   canBuy(s);

   const status=
   isUnlocked(s)
   ?"unlocked"
   :ok
   ?"available"
   :"locked";

   if(
    q &&
    !(
     `${s.name} ${s.desc} ${branch}`
     .toLowerCase()
     .includes(q)
    )
   )continue;

   if(
    f!=="all" &&
    f!==status
   )continue;

   const n=
   document.createElement("article");

   n.className=
   "node "+status;

   n.innerHTML=
   '<span class="levelPill">'+
   'Nível '+s.level+
   '</span>'+
   '<div class="rarity">'+
   s.rarity+
   '</div>'+
   '<h3>'+
   s.name+
   '</h3>'+
   '<p>'+
   s.desc+
   '</p>'+
   '<div class="meta">'+
   'Custo: '+s.cost+
   '</div>'+
   '<div class="meta">'+
   'Progresso: '+spent+'/'+s.max+
   '</div>'+
   '<div class="progress">'+
   '<i style="width:'+
   Math.min(
    100,
    spent/s.max*100
   )+'%"></i>'+
   '</div>'+
   '<button class="buy" '+
   (!ok?"disabled":"")+
   '>'+
   (
    (spent>0&&s.max>1)
    ?"Aprimorar"
    :"Desbloquear"
   )+
   '</button>';

   n.querySelector(".buy").onclick=e=>{
    e.stopPropagation();
    buy(s.name);
   };

   let timer;

   n.addEventListener(
    "click",
    ()=>openSkill(s)
   );

   n.addEventListener(
    "pointerdown",
    e=>{
     if(e.pointerType==="touch")
      timer=setTimeout(
       ()=>openSkill(s),
       450
      );
    }
   );

   [
    "pointerup",
    "pointercancel",
    "pointerleave"
   ].forEach(x=>
    n.addEventListener(
     x,
     ()=>clearTimeout(timer)
    )
   );

   box.appendChild(n);

  }

  if(box.children.length)
   root.appendChild(sec);

 }

}

function buy(n){

 const s=find(n);

 if(!s||!canBuy(s))
  return;

 state.spent[sid(n)]=
 (state.spent[sid(n)]||0)+s.cost;

 state.history.push({
  name:n,
  cost:s.cost
 });

 saveState();

 render();

 notify(n+" desbloqueada.");

}

function undo(){

 const h=
 state.history.pop();

 if(!h)
  return notify(
   "Nada para desfazer."
  );

 state.spent[sid(h.name)]-=h.cost;

 if(
  state.spent[sid(h.name)]<=0
 )
  delete state.spent[sid(h.name)];

 saveState();

 render();

 notify("Compra desfeita.");

}

function openSkill(s){

 selected=s;

 const spent=
 state.spent[sid(s.name)]||0;

 document.getElementById("mr").textContent=
 s.rarity;

 document.getElementById("mn").textContent=
 s.name;

 document.getElementById("md").textContent=
 s.desc;

 document.getElementById("ml").textContent=
 s.level;

 document.getElementById("mc").textContent=
 s.cost+
 " ponto"+
 (s.cost>1?"s":"");

 document.getElementById("mreq").textContent=
 s.req||
 "Início da ramificação";

 document.getElementById("ms").textContent=
 isUnlocked(s)
 ?"Desbloqueada ("+
 spent+
 "/"+
 s.max+
 ")"
 :
 canBuy(s)
 ?"Desbloqueável"
 :"Bloqueada";

 const b=
 document.getElementById("mbuy");

 b.disabled=
 !canBuy(s);

 b.textContent=
 spent&&s.max>1
 ?"Aprimorar"
 :"Desbloquear";

 document
 .getElementById("skillModal")
 .classList.add("open");

}

function exportBuild(){

 const p={
  v:2,
  class:state.cls,
  level:state.level,
  spent:state.spent
 };

 document.getElementById("code").value=
 btoa(
  unescape(
   encodeURIComponent(
    JSON.stringify(p)
   )
  )
 );

 document
 .getElementById("codeModal")
 .classList
 .add("open");

}

function importBuild(){

 const c=
 prompt(
  "Cole o código da build:"
 );

 if(!c)return;

 try{

  const p=
  JSON.parse(
   decodeURIComponent(
    escape(
     atob(c.trim())
    )
   )
  );

  if(
   !DATA[p.class]||
   p.level<1||
   p.level>20
  )
   throw 0;

  state={
   cls:p.class,
   level:p.level,
   spent:p.spent||{},
   history:[]
  };

  saveState();

  render();

  notify(
   "Build importada."
  );

 }catch(e){

  alert(
   "Código inválido."
  );

 }

}

document.getElementById("level").oninput=e=>{

 state.level=
 Math.max(
  1,
  Math.min(
   20,
   Number(e.target.value)||1
  )
 );

 saveState();

 render();

};

document.getElementById("search").oninput=
renderTree;

document.getElementById("filter").onchange=
renderTree;

document.getElementById("undo").onclick=
undo;

document.getElementById("save").onclick=
exportBuild;

document.getElementById("import").onclick=
importBuild;

document.getElementById("reset").onclick=()=>{

 if(
  confirm(
   "Resetar todos os pontos desta classe?"
  )
 ){

  state.spent={};
  state.history=[];

  saveState();
  render();

  notify(
   "Árvore resetada."
  );

 }

};

document.getElementById("help").onclick=()=>{

 alert(
  "Clique em uma habilidade para ver seus detalhes. "+
  "No celular, toque e segure. "+
  "Habilidades exigem nível, pontos e, em alguns casos, "+
  "um pré-requisito. O salvamento automático usa o navegador."
 );

};

document.getElementById("closeSkill").onclick=()=>{

 document
 .getElementById("skillModal")
 .classList
 .remove("open");

};

document.getElementById("closeCode").onclick=()=>{

 document
 .getElementById("codeModal")
 .classList
 .remove("open");

};

document.getElementById("mbuy").onclick=()=>{

 if(selected)
  buy(selected.name);

 document
 .getElementById("skillModal")
 .classList
 .remove("open");

};

document.getElementById("copy").onclick=async()=>{

 try{

  await navigator.clipboard.writeText(
   document.getElementById("code").value
  );

  notify(
   "Código copiado."
  );

 }catch{

  document
  .getElementById("code")
  .select();

 }

};

render();

</script>

</body>
</html>
